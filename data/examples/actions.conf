# actions.conf — commands launched by desktop actions
#
# Place in the configuration directory passed via `xw-compositor -c DIR`
# (xw-session uses $XDG_CONFIG_HOME/xfce4-wayland).
# Commands run through /bin/sh exactly as written; unset keys keep the
# built-in defaults (which name xfce4-wayland's own tools where they
# exist, e.g. xw-exit).

[commands]
# Terminal for Super+T / panel launcher. $XW_TERMINAL overrides this.
terminal = x-terminal-emulator
# Application finder (Super+Space when bound).
appfinder = xw-appfinder
# Session exit dialog (Ctrl+Alt+Delete). Must be the xw-exit binary
# for the dialog to appear.
exit-dialog = xw-exit
# Screen lock command (Super+L when bound).
lock = xw-lock
# Screenshot command (Print when bound).
screenshot = xw-screenshot
# Volume/media handlers (XF86Audio* keys).
volume-up = amixer set Master 5%+
volume-down = amixer set Master 5%-
volume-mute = amixer set Master toggle
media = playerctl play-pause
