# workspaces.conf — workspace layout
#
# Place in the configuration directory passed via `xw-compositor -c DIR`
# (xw-session uses $XDG_CONFIG_HOME/xfce4-wayland).

[workspaces]
# Number of workspaces (1..12).
count = 4
# Optional names, used by the panel workspace switcher.
name_1 = Main
name_2 = Work
name_3 = Web
name_4 = Misc
