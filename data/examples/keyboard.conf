# keyboard.conf — keyboard behavior
#
# Place in the configuration directory passed via `xw-compositor -c DIR`
# (xw-session uses $XDG_CONFIG_HOME/xfce4-wayland).
#
# Key repeat follows the Wayland protocol: the compositor advertises
# rate/delay via wl_keyboard.repeat_info and CLIENTS repeat keys
# themselves; keys used by interactive keyboard move/resize are
# additionally repeated server-side so held arrows keep moving windows.

[keyboard]
# Delay before repeats start, in milliseconds (default 500).
repeat_delay_ms = 500
# Repeats per second (default 30).
repeat_rate_hz = 30
