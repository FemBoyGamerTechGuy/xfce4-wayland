# shortcuts.conf — global keyboard shortcuts
#
# Place in the configuration directory passed via `xw-compositor -c DIR`
# (xw-session uses $XDG_CONFIG_HOME/xfce4-wayland).
#
# Syntax:  action-name = <Super|Alt|Ctrl|Shift>+<Key>
# A key is a keysym name (a, Return, Tab, F1..F12, Left/Right/Up/Down,
# Print, XF86AudioRaiseVolume, ...) or a raw keysym in hex (0x0041).
# Entries override the built-in xfwm4 4.20 default table for the same
# action; unlisted actions keep their defaults. `run-command` uses the
# form:  run-command = <binding> | <command line>
# Unknown actions or unparseable bindings are reported with a warning
# at startup and ignored; conflicting bindings are detected and logged.

[shortcuts]
# Examples (these match the built-in defaults):
# close-window = Alt+F4
# maximize-window = Alt+F10
# show-desktop = Ctrl+Alt+D
# cycle-windows = Alt+Tab
# workspace-left = Ctrl+Alt+Left
# workspace-right = Ctrl+Alt+Right
# workspace-1 = Super+1
# move-window-workspace-3 = Super+3
# exit-dialog = Ctrl+Alt+Delete
# terminal = Super+T

# Custom command example:
# run-command = Super+E | xdg-open ~
