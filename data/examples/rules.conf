# rules.conf — window rules applied at map time
#
# Place in the configuration directory passed via `xw-compositor -c DIR`
# (xw-session uses $XDG_CONFIG_HOME/xfce4-wayland).
#
# Each section starting with "rule" is one rule. match-app-id and
# match-title are fnmatch(3) patterns (* and ? wildcards); a rule with
# no match keys matches every window. All matching rules apply, in
# file order (a later rule can override an earlier one).

[rule: messenger-on-web]
match-app-id = Pidgin
workspace = 3

[rule: file-manager]
match-app-id = Thunar
workspace = 2

[rule: notifications]
match-app-id = Xfce4-notifyd
# sticky = visible on every workspace
sticky = true

[rule: settings-dialog]
match-app-id = xw-settings
workspace = 1
# no-focus = map without stealing keyboard focus
no-focus = true

[rule: video-fullscreen]
match-title = *YouTube*
fullscreen = true
