# panel.conf — the xw-panel configuration
#
# Place in $XDG_CONFIG_HOME/xw-panel/panel.conf (usually
# ~/.config/xw-panel/panel.conf). Every key below shows its default;
# deleting a line keeps that default. No file at all is fine.

[panel]
# height = auto            # auto (derive from the output size) or px, 24..200
# position = top           # top | bottom
# launchers =              # comma-separated desktop ids shown next to Start
# favorites =              # comma-separated desktop ids pinned in the menu
# icon-theme =             # XDG icon theme name (hicolor is the fallback)

[clock]
# format = %a %d %b %H:%M  # tokens: %a %b %d %m %H %I %M %S %p %y %Y %%
# seconds = false          # true makes the bar tick every second

[tasklist]
# style = icons+text       # icons+text | icons | text

[menu]
# icons = true             # render XDG icons in the applications menu
